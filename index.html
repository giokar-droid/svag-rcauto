<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>La tua auto</title>
<style>
:root {
  --bg: #F6F3EC; --card: #FFFFFF; --ink: #1D2927; --muted: #56635F; --line: #E3DDD0;
  --accent: #00695C; --accent-ink: #FFFFFF; --accent-soft: #E3F0EE;
  --gold: #9A7328; --warn: #9A4A1C; --off: #F1EEE6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141A19; --card: #1C2422; --ink: #E8EEEC; --muted: #A3B0AD; --line: #2D3735;
    --accent: #4DB6A6; --accent-ink: #0E1413; --accent-soft: #1F3330;
    --gold: #D4AE62; --warn: #E0936A; --off: #232C2A;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
header { padding: 18px 0 10px; }
.marca { font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.avanz { height: 5px; background: var(--line); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.avanz > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
main:focus { outline: none; }
h1 { font-size: 26px; line-height: 1.2; margin: 18px 0 8px; }
h2 { font-size: 23px; line-height: 1.25; margin: 16px 0 4px; }
h3 { font-size: 19px; margin: 22px 0 6px; }
.sotto { color: var(--muted); margin: 0 0 14px; }
p { margin: 0 0 12px; }
ul.punti, ol.punti { padding-left: 22px; margin: 0 0 16px; }
ul.punti li, ol.punti li { margin-bottom: 8px; }
ul.punti ul { padding-left: 20px; margin: 6px 0 0; }
.box { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
.box.oro { background: var(--off); border-left: 4px solid var(--gold); }
.box ul { margin: 8px 0 0; padding-left: 20px; }
.box li { margin-bottom: 6px; }
.box .tit { font-weight: 700; }
.box p:last-child { margin-bottom: 0; }

/* domande */
.dom { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
.dom .dom { background: transparent; border: 0; border-left: 3px solid var(--accent-soft); border-radius: 0; padding: 2px 0 2px 14px; margin: 16px 0 4px; }
.riga-el .dom { border-left: 0; padding-left: 0; margin: 14px 0 0; }
.riga-el .dom .dom { border-left: 3px solid var(--line); padding-left: 12px; }
.dom-t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.lbl { font-weight: 650; font-size: 18px; line-height: 1.35; }
.dom .dom .lbl { font-size: 17px; }
.chip { display: inline-block; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 600; }
.aiuto { color: var(--muted); font-size: 16px; margin-top: 4px; }
.perche { color: var(--muted); font-size: 15px; margin-top: 6px; }
.perche b { font-weight: 600; }
.perche.forte { color: var(--ink); background: var(--off); border-left: 3px solid var(--gold); padding: 8px 12px; border-radius: 0 8px 8px 0; }
.ctrl { margin-top: 10px; }
.opzioni { display: grid; gap: 8px; }
.opzioni.orizz { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.opz {
  font: inherit; text-align: left; width: 100%; min-height: 48px; line-height: 1.35;
  padding: 11px 14px 11px 46px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--ink); cursor: pointer; position: relative;
}
.opz::before {
  content: ""; position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; margin-top: -10px;
  border: 2px solid var(--muted); border-radius: 50%; box-sizing: border-box;
}
.opz.check::before { border-radius: 5px; }
.opz[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.opz.radio[aria-pressed="true"]::before { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-soft); }
.opz.check[aria-pressed="true"]::before { border-color: var(--accent); background: var(--accent); }
.opz.check[aria-pressed="true"]::after {
  content: ""; position: absolute; left: 21px; top: 50%; width: 6px; height: 11px; margin-top: -8px;
  border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
}
.opz:disabled { opacity: .5; cursor: default; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.pill {
  font: inherit; font-size: 15px; line-height: 1.35; text-align: left; border: 1.5px solid var(--line);
  background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
input.inp, textarea.inp, input.inp-x, textarea.inp-x {
  width: 100%; font: inherit; padding: 12px 14px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
}
textarea.inp, textarea.inp-x { resize: vertical; min-height: 84px; }
input.inp:focus, textarea.inp:focus, input.inp-x:focus, textarea.inp-x:focus { outline: none; border-color: var(--accent); }
.inp.sbagliato { border-color: var(--warn); }
.riga-campo { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.num-w { position: relative; flex: 1 1 170px; max-width: 280px; }
.num-w .cur { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
input.num { text-align: right; font-weight: 600; }
input.num.imp { padding-left: 54px; }
input.corto { max-width: 210px; }
.unita-t { color: var(--muted); font-size: 16px; }
.eta { color: var(--muted); font-size: 16px; }
.valute { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.valute button { font: inherit; font-size: 15px; border: 0; background: var(--card); color: var(--muted); padding: 0 14px; min-height: 46px; cursor: pointer; }
.valute button + button { border-left: 1px solid var(--line); }
.valute button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.err { color: var(--warn); font-size: 15px; margin-top: 6px; font-weight: 600; }
.avvisi .box { margin: 10px 0 0; font-size: 16px; }
.calcolo { margin-top: 10px; font-size: 16px; }
.calcolo p { margin: 0 0 6px; }
.calcolo .attenzione { color: var(--warn); font-weight: 600; }
.nota { font-size: 15px; color: var(--muted); }
.precnota { margin-top: 8px; }
.riquadro { background: var(--off); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 16px; }
.riquadro .tit { font-weight: 700; margin-bottom: 4px; }
.riquadro ol, .riquadro ul { margin: 4px 0 0; padding-left: 22px; }
.riquadro li { margin-bottom: 4px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 16px; }
th { font-size: 15px; color: var(--muted); font-weight: 600; }
td.n { text-align: right; white-space: nowrap; }
#app { overflow-wrap: break-word; }
td { overflow-wrap: break-word; }
table td:first-child:not([colspan]) { width: 44%; }
table.veicolo { margin: 4px 0 6px; }
table.veicolo td.n { white-space: normal; min-width: 90px; }
table.veicolo td:first-child { width: 58%; }
tr.sub td:first-child { padding-left: 18px; color: var(--muted); }
.vl { margin: 0; padding-left: 18px; }
.vl li { margin-bottom: 2px; }
.kv { margin-bottom: 6px; }
.kvs { margin: 6px 0 0 14px; }
.kv .k { color: var(--muted); }
.cat-tit { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 24px; }
.cat-tit a { font-size: 16px; color: var(--accent); white-space: nowrap; }

/* elenchi ripetibili */
.righe { display: block; }
.riga-el { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; margin: 12px 0; background: var(--bg); }
.riga-tit { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.riga-tit b { font-size: 17px; }
.el-azioni { display: grid; gap: 8px; margin-top: 10px; }
.el-azioni .pill { justify-self: start; }

/* pulsanti */
button.link {
  font: inherit; font-size: 16px; background: transparent; border: 0; color: var(--accent);
  text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; cursor: pointer;
}
.azioni { display: grid; gap: 10px; margin: 18px 0; }
button.primario, button.secondario {
  font: inherit; font-weight: 650; border-radius: 12px; padding: 14px 18px; cursor: pointer; text-align: center;
}
button.primario { background: var(--accent); color: var(--accent-ink); border: 0; font-size: 18px; }
button.secondario { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
button.largo { width: 100%; }
details { margin: 12px 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 16px; }
pre { white-space: pre-wrap; word-break: break-all; background: var(--off); padding: 12px; border-radius: 10px; font-size: 15px; }
.esito { font-weight: 600; color: var(--accent); min-height: 1.5em; }
label.campo { display: block; font-weight: 650; margin: 18px 0 6px; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

nav.barra {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
  border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
}
nav.barra .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
nav.barra button { font: inherit; font-weight: 650; border-radius: 12px; padding: 12px 16px; min-width: 112px; cursor: pointer; }
#indietro { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
#avanti { background: var(--accent); border: 0; color: var(--accent-ink); }
nav.barra .invisibile { visibility: hidden; }
#passo { font-size: 15px; color: var(--muted); text-align: center; }
.vuoto { text-align: center; padding: 40px 0; color: var(--muted); }
</style>
<script src="domande.js"></script>
</head>
<body>
<header class="wrap">
  <div class="marca">Giorgio Carrara, consulenza patrimoniale SVAG</div>
  <div class="avanz" aria-hidden="true"><i id="avanz"></i></div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<nav class="barra" aria-label="Navigazione">
  <div class="wrap">
    <button id="indietro" type="button">← Indietro</button>
    <span id="passo"></span>
    <button id="avanti" type="button">Avanti →</button>
  </div>
</nav>

<script>
(function () {
  "use strict";
  // Wizard RC auto per il cliente, versione 1.0 (11.10.2026).
  // Le domande arrivano da domande.js, generato da build.py dalla banca rcauto_domande_v1.json:
  // qui non si scrivono domande. La pagina non trasmette niente: il cliente manda le risposte da sé.
  var VERSIONE = "1.0";
  var CHIAVE = "svag-rcauto-wizard-v1";      // «Cancella» toglie solo questa chiave
  var TITOLO = "La tua auto: i dati per l'assicurazione";
  var B = window.SVAG_RCAUTO;
  var app = document.getElementById("app");
  if (!B || !B.passi) {
    app.innerHTML = '<p class="vuoto">La pagina non si è caricata del tutto. Ricaricala tra un attimo.</p>';
    return;
  }
  var RIT = B.ritorno;
  var OGGI = new Date(); OGGI.setHours(12, 0, 0, 0);
  try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
  var NOME_RIGA = { conducenti: "Persona", altri_veicoli: "Veicolo", sinistri: "Danno",
                    ritiro_licenza: "Ritiro", proposta_rifiutata: "Rifiuto o disdetta" };

  // ── indici della banca
  var Q = {}, SUB = {}, PASSO_DI = {}, EL = {}, ELC = {}, DOC = {}, RAMO = {}, PASSO = {};
  function indicizza(d) {
    (d.campi || []).forEach(function (c) { SUB[c.id] = { def: c, padre: d.id }; indicizza(c); });
  }
  B.passi.forEach(function (p) {
    PASSO[p.id] = p;
    p.domande.forEach(function (d) {
      Q[d.id] = d; PASSO_DI[d.id] = p;
      if (d.tipo === "elenco") {
        EL[d.id] = d;
        var m = ELC[d.id] = {};
        (function giu(lista, padre) {
          (lista || []).forEach(function (c) { m[c.id] = { def: c, padre: padre }; giu(c.campi, c.id); });
        })(d.campi, null);
      } else indicizza(d);
    });
  });
  B.documenti.forEach(function (d) { DOC[d.id] = d; });
  B.rami.forEach(function (r) { RAMO[r.id] = r; });
  function def(id) { return Q[id] || (SUB[id] && SUB[id].def) || null; }

  // ── piccoli attrezzi
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function vuoto(x) { return x === undefined || x === null || x === "" || (Array.isArray(x) && !x.length); }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function clona(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function dataTesto(dt) { return pad2(dt.getDate()) + "." + pad2(dt.getMonth() + 1) + "." + dt.getFullYear(); }
  function maiuscola(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function trovaOpz(d, v) {
    var l = (d && d.opzioni) || [];
    for (var i = 0; i < l.length; i++) if (l[i].v === v) return l[i];
    return null;
  }
  function rapida(d, v) {
    var r = (d && d.scelte_rapide) || {}, k, i;
    for (k in r) for (i = 0; i < r[k].length; i++) if (r[k][i].v === v) return r[k][i];
    return null;
  }
  function codicePill(d, v) { return v === "nonso" || !!rapida(d, v); }

  // numeri: accetta 12'500, 12 500, 12.500, 1490,50 e 1490.50
  function norm(t) {
    t = String(t == null ? "" : t).replace(/chf|eur|fr\.?|km|cm³|€/ig, "").replace(/[\s'’`´]/g, "");
    if (t === "") return "";
    if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
    else if (/^\d{1,3}(,\d{3})+$/.test(t)) t = t.replace(/,/g, "");
    else if (t.indexOf(",") >= 0 && t.indexOf(".") < 0) t = t.replace(",", ".");
    if (!/^\d*\.?\d*$/.test(t) || t === ".") return null;
    var n = Number(t);
    if (!isFinite(n) || n < 0) return null;
    return String(Math.round(n * 100) / 100);
  }
  function fmtNum(s) {
    var n = Number(s);
    if (!isFinite(n)) return String(s);
    var f = Math.abs(n).toFixed(n % 1 !== 0 ? 2 : 0).split(".");
    f[0] = f[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
    return (n < 0 ? "-" : "") + f.join(".");
  }

  // date: sempre GG.MM.AAAA, mai il campo data del browser
  function costruisciData(g, m, a) {
    if (a < 100) a += (2000 + a <= OGGI.getFullYear() + 5) ? 2000 : 1900;
    if (a < 1900 || a > 2100 || m < 1 || m > 12 || g < 1 || g > 31) return null;
    var dt = new Date(a, m - 1, g, 12);
    if (dt.getMonth() !== m - 1 || dt.getDate() !== g) return null;
    return { d: dt, testo: pad2(g) + "." + pad2(m) + "." + a };
  }
  function leggiData(s) {
    if (typeof s !== "string") return null;
    s = s.trim(); var m;
    if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s))) return costruisciData(+m[3], +m[2], +m[1]);
    if ((m = /^(\d{1,2})[.\/\- ](\d{1,2})[.\/\- ](\d{2}|\d{4})$/.exec(s))) return costruisciData(+m[1], +m[2], +m[3]);
    if ((m = /^(\d{2})(\d{2})(\d{4})$/.exec(s))) return costruisciData(+m[1], +m[2], +m[3]);
    if ((m = /^(\d{2})(\d{2})(\d{2})$/.exec(s))) return costruisciData(+m[1], +m[2], +m[3]);
    return null;
  }
  function leggiMeseAnno(s) {
    s = String(s).trim();
    var m = /^(\d{1,2})[.\/\- ](\d{2}|\d{4})$/.exec(s) || /^(\d{1,2})(\d{4})$/.exec(s);
    if (!m) return null;
    var mm = +m[1], a = +m[2]; if (a < 100) a += 2000;
    if (mm < 1 || mm > 12 || a < 1950 || a > OGGI.getFullYear() + 2) return null;
    return pad2(mm) + "." + a;
  }
  function leggiDataOAnno(s) {
    s = String(s).trim();
    if (/^\d{4}$/.test(s)) { var a = +s; return (a >= 1950 && a <= OGGI.getFullYear() + 1) ? s : null; }
    if (/^\d{1,2}[.\/\- ]\d{4}$/.test(s) || /^\d{6}$/.test(s)) { var ma = leggiMeseAnno(s); if (ma) return ma; }
    var d = leggiData(s); return d ? d.testo : null;
  }
  // punti automatici mentre si digita una data: «1.2.» diventa «01.02.», le cifre si raggruppano 2-2-4
  function dataDalVivo(raw) {
    var parti = raw.replace(/[\/\- ]/g, ".").replace(/[^\d.]/g, "").split(".");
    for (var i = 0; i < parti.length - 1 && i < 2; i++) if (parti[i].length === 1) parti[i] = "0" + parti[i];
    var c = parti.join("").slice(0, 8);
    if (c.length > 4) return c.slice(0, 2) + "." + c.slice(2, 4) + "." + c.slice(4);
    if (c.length > 2) return c.slice(0, 2) + "." + c.slice(2);
    return c;
  }
  function anni(da, a) {
    var n = a.getFullYear() - da.getFullYear();
    if (a.getMonth() < da.getMonth() || (a.getMonth() === da.getMonth() && a.getDate() < da.getDate())) n--;
    return n;
  }
  function firma(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); }

  // ── frammento del link (tutto dopo «#» resta nel browser: il sito che ospita la pagina non lo riceve)
  function leggiHash(nome) {
    var m = new RegExp("(?:^|[#&])" + nome + "=([^&]*)").exec(location.hash);
    return m ? m[1] : null;
  }
  // #salta=id,id,… : solo nomi di domanda o di documento, mai dati
  var SALTA = null;
  (function () {
    var s = leggiHash("salta"); if (s === null) return;
    var amm = {}; B.salta_ammessi.forEach(function (k) { amm[k] = true; });
    try { s = decodeURIComponent(s); } catch (e) {}
    SALTA = {};
    s.split(",").forEach(function (id) { id = id.trim(); if (amm[id]) SALTA[id] = true; });
  })();
  // #pre=<base64url di un JSON {id: valore}> (formato della banca) oppure di «id=valore;id=valore»
  function daBase64url(s) {
    var b64 = s.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    return decodeURIComponent(Array.prototype.map.call(atob(b64), function (ch) {
      return "%" + ("00" + ch.charCodeAt(0).toString(16)).slice(-2);
    }).join(""));
  }
  function valorePre(d, x) {
    if (x === null || x === undefined) return null;
    if (d.tipo === "scelta_multipla") {
      var arr = (Array.isArray(x) ? x : String(x).split(",")).map(function (y) { return String(y).trim(); })
        .filter(function (y) { return !!trovaOpz(d, y); });
      return arr.length ? arr : null;
    }
    x = String(x).trim();
    if (!x || x.length > 80) return null;
    if (d.tipo === "scelta" || d.tipo === "si_no") return trovaOpz(d, x) ? x : null;
    if (d.tipo === "data") { var dd = leggiData(x); return dd ? dd.testo : null; }
    if (d.tipo === "numero" || d.tipo === "importo") { var n = norm(x); return n ? n : null; }
    if (d.tipo === "testo") return x.replace(/[\u0000-\u001f<>]/g, "");
    return null;
  }
  var PRE = null;
  (function () {
    var s = leggiHash("pre"); if (!s) return;
    var testo, grezzo = {};
    try { testo = daBase64url(s).trim(); } catch (e) { return; }
    if (testo.charAt(0) === "{") {
      try { grezzo = JSON.parse(testo); } catch (e) { return; }
      if (!grezzo || typeof grezzo !== "object") return;
    } else {
      testo.split(";").forEach(function (kv) {
        var i = kv.indexOf("="); if (i > 0) grezzo[kv.slice(0, i).trim()] = kv.slice(i + 1).trim();
      });
    }
    var amm = {}; B.pre_ammessi.forEach(function (k) { amm[k] = true; });
    var v = {}, ids = [];
    Object.keys(grezzo).forEach(function (k) {
      var d = Q[k];

        if (d.tipo === "conferma_veicolo") corpo += '<tr><td colspan="2">' + htmlTabellaVeicolo(d) + "</td></tr>";
        if (vuoto(v)) { if (d.importante) mancano.push({ t: d.breve, p: p.id }); }
        else corpo += "<tr><td>" + esc(d.breve) + '</td><td class="' + (numerico(d) && !codicePill(d, v) ? "n" : "") + '">' + htmlRisposta(d, v, S.val[d.id]) + "</td></tr>";
        Object.keys(SUB).forEach(function (sid) {
          if (!discende(sid, d.id) || !visibile(sid)) return;
          var w = V(sid), c = SUB[sid].def; if (vuoto(w)) return;
          corpo += '<tr class="sub"><td>' + esc(c.testo) + '</td><td class="' + (numerico(c) && !codicePill(c, w) ? "n" : "") + '">' + htmlRisposta(c, w, S.val[sid]) + "</td></tr>";
        });
      });
      if (corpo) h += '<div class="cat-tit"><b>' + esc(p.titolo) + '</b><a href="#" data-vai="' + esc(p.id) + '">modifica</a></div>' +
        "<table><tbody>" + corpo + "</tbody></table>";
    });
    var dv = docVisibili();
    if (dv.length) {
      h += '<div class="cat-tit"><b>' + esc(PASSO.documenti.titolo) + '</b><a href="#" data-vai="documenti">modifica</a></div><table><tbody>' +
        dv.map(function (id) {
          var st = S.doc[id], o = st ? trovaOpz({ opzioni: DOC[id].stati }, st) : null;
          return "<tr><td>" + esc(DOC[id].nome) + '</td><td class="n">' + (o ? esc(o.t) : '<span class="nota">Non indicato</span>') + "</td></tr>";
        }).join("") + "</tbody></table>";
    }
    if (mancano.length) {
      h += '<div class="box oro"><div class="tit">Senza risposta</div><ul>' + mancano.map(function (m) {
        return '<li><a href="#" data-vai="' + esc(m.p) + '">' + esc(m.t) + "</a></li>";
      }).join("") + "</ul><p>Va bene così se non le sai: te le chiedo a voce.</p></div>";
    }
    var nf = R.nota_finale;
    h += '<label class="campo" for="nota">' + esc(nf.testo) + "</label>" +
      '<textarea class="inp-x" id="nota" data-campo="nota" rows="3" maxlength="1500"></textarea>';
    h += "<h2>Manda le risposte a Giorgio</h2>" +
      '<div class="box privacy"><div class="tit">Prima di inviare</div><ul>' + RIT.prima_di_inviare.map(liTesto).join("") + "</ul></div>";
    if (!S.nome) h += '<label class="campo" for="nome2">' + esc(B.introduzione.nome.testo) + '</label><input class="inp-x" id="nome2" data-campo="nome" maxlength="80" placeholder="Nome e cognome">';
    h += '<div class="azioni">' + RIT.pulsanti.map(function (b) {
      return '<button type="button" class="' + (b.principale ? "primario" : "secondario") + '" id="inv_' + esc(b.id) + '">' + esc(b.testo) + "</button>";
    }).join("") + '</div><p class="esito" id="esito" aria-live="polite"></p>' +
      '<p class="nota">Se nessun pulsante apre l\'app, tocca «Copia i dati» e incollali in un messaggio a Giorgio, su WhatsApp (' +
      esc(RIT.whatsapp_leggibile) + ") o per e-mail (" + esc(RIT.email) + ").</p>" +
      '<details><summary>Vedi i dati che invii</summary><pre id="json"></pre></details>' +
      '<p><button class="link" type="button" id="cancella">' + esc(RIT.cancella) + "</button></p>";
    app.innerHTML = h;
    document.getElementById("nota").value = S.nota || "";
    aggiornaJson();
    var esito = document.getElementById("esito");
    function su(id, fn) { var b = document.getElementById("inv_" + id); if (b) b.addEventListener("click", function () { raccogli(); salvaSubito(); aggiornaJson(); fn(); }); }
    su("whatsapp", function () {
      var url = "https://wa.me/" + RIT.whatsapp + "?text=" + encodeURIComponent(messaggio());
      var w = window.open(url, "_blank", "noopener"); if (!w) location.href = url;
      esito.textContent = RIT.esiti.whatsapp;
    });
    su("email", function () {
      var sogg = "Assicurazione auto" + (S.nome ? " - " + S.nome : "");
      location.href = "mailto:" + RIT.email + "?subject=" + encodeURIComponent(sogg) + "&body=" + encodeURIComponent(messaggio() + "\n");
      esito.textContent = RIT.esiti.email;
    });
    su("copia", function () {
      var t = messaggio();
      function ok() { esito.textContent = RIT.esiti.copia; }
      function ko() { esito.textContent = "Copia non riuscita: apri «Vedi i dati che invii» e copiali a mano."; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { if (copiaVecchia(t)) ok(); else ko(); });
      else if (copiaVecchia(t)) ok(); else ko();
    });
    su("scarica", function () {
      var dati = datiDaInviare(), oggi = new Date();
      var nomeFile = "rcauto-" + oggi.getFullYear() + "-" + pad2(oggi.getMonth() + 1) + "-" + pad2(oggi.getDate()) + ".json";
      var url = URL.createObjectURL(new Blob([JSON.stringify(dati, null, 1)], { type: "application/json" }));
      var a = document.createElement("a"); a.href = url; a.download = nomeFile;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      esito.textContent = RIT.esiti.scarica;
    });
    document.getElementById("cancella").addEventListener("click", function () {
      if (!confirm("Cancellare le tue risposte da questo dispositivo? Quelle già inviate a Giorgio restano a lui.")) return;
      try { localStorage.removeItem(CHIAVE); } catch (e) {}
      S = applicaPre(statoVuoto()); S.salta = Object.keys(SALTA); ripreso = false;
      app.innerHTML = "";                         // niente da raccogliere dalla pagina vecchia
      invalida(); mostra("intro");
    });
  }
  function discende(sid, qid) {
    var p = SUB[sid] && SUB[sid].padre, n = 0;
    while (p && n++ < 10) { if (p === qid) return true; p = SUB[p] ? SUB[p].padre : null; }
    return false;
  }

  // ── il messaggio per Giorgio: una riga leggibile, le foto promesse, poi il JSON
  function datiDaInviare() {
    invalida();
    var r = {}, nonso = [];
    function metti(id, d, v) {
      r[id] = v;
      if (v === "nonso") nonso.push(id);
      else if (d.valute && S.val[id] === "EUR") r[id + "_valuta"] = "EUR";
    }
    B.passi.forEach(function (p) {
      p.domande.forEach(function (d) {
        if (d.tipo === "elenco") return;
        var v = V(d.id); if (!vuoto(v)) metti(d.id, d, v);
        Object.keys(SUB).forEach(function (sid) {
          if (!discende(sid, d.id)) return;
          var w = V(sid); if (!vuoto(w)) metti(sid, SUB[sid].def, w);
        });
      });
    });
    function elenco(eid) {
      if (!visibile(eid)) return undefined;
      var e = statoEl(eid);
      if (!e.righe.length) {
        if (e.nonso) { nonso.push(eid); return null; }
        return e.vuoto ? [] : null;
      }
      return e.righe.map(function (rw, i) {
        var o = {};
        if (eid === "conducenti") o.rif = rw._k;
        Object.keys(ELC[eid]).forEach(function (cid) {
          var w = VR(rw, eid, cid); if (vuoto(w)) return;
          o[cid] = w;
          if (w === "nonso") nonso.push(eid + "." + (i + 1) + "." + cid);
          else if (rw[cid + "_valuta"] === "EUR") o[cid + "_valuta"] = "EUR";
          if (typeof w === "string" && w.indexOf("cond:") === 0) o[cid + "_nome"] = nomeConducente(w.slice(5));
        });
        return o;
      });
    }
    var docs = {}, mando = [];
    docVisibili().forEach(function (id) {
      if (!S.doc[id]) return;
      docs[id] = S.doc[id];
      if (S.doc[id] === "mando") mando.push(id);
    });
    var ora = new Date();
    var out = {
      tipo: "svag-rcauto-wizard", versione: VERSIONE, banca: B.banca + " " + B.versione_banca,
      creato: dataTesto(ora) + " " + pad2(ora.getHours()) + ":" + pad2(ora.getMinutes()),
      nome: S.nome || "",
      risposte: r
    };
    var cond0 = elenco("conducenti"), sin0 = elenco("sinistri");
    out.conducenti = cond0 === undefined ? null : cond0;
    out.sinistri = sin0 === undefined ? null : sin0;
    ["altri_veicoli", "ritiro_licenza", "proposta_rifiutata"].forEach(function (k) { var x = elenco(k); if (x !== undefined) out[k] = x; });
    out.precompilato = Object.keys(S.pre);
    out.modificate = modificate();
    out.non_so = nonso;
    out.documenti_da_mandare = mando;
    out.documenti = docs;
    out.saltate = Object.keys(SALTA);
    out.rami = B.rami.filter(function (x) { return ramo(x.id); }).map(function (x) { return x.id; });
    if (S.nota) out.nota_finale = S.nota;
    return out;
  }
  function messaggio() {
    var d = datiDaInviare();
    var l = ["Ciao Giorgio, ecco le risposte per l'assicurazione dell'auto" + (S.nome ? " (" + S.nome + ")" : "") +
             ", compilate il " + dataTesto(new Date()) + "."];
    if (d.documenti_da_mandare.length) {
      l.push("Ti mando queste foto:");
      d.documenti_da_mandare.forEach(function (id) { l.push("- " + DOC[id].nome); });
    }
    l.push("Il testo qui sotto serve al tuo programma ed è giusto così: va mandato com'è.");
    return l.join("\n") + "\n\n" + JSON.stringify(d);
  }
  function aggiornaJson() {
    var pre = document.getElementById("json");
    if (pre) pre.textContent = messaggio();
  }
  function copiaVecchia(t) {
    var ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); return ok;
  }

  // ── chi chiude la pagina subito dopo l'ultima risposta non deve perderla
  window.addEventListener("pagehide", function () { raccogli(); salvaSubito(); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") { raccogli(); salvaSubito(); } });
  document.getElementById("indietro").addEventListener("click", function () { raccogli(); mostra(vicino(-1), true); });
  document.getElementById("avanti").addEventListener("click", function () { raccogli(); mostra(vicino(1), true); });
  window.SVAG_RCAUTO_PAGINA = { versione: VERSIONE, dati: datiDaInviare, messaggio: messaggio };   // per il collaudo
  mostra(S.schermo);
})();
</script>
